apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: delay-inventario-db
  namespace: happydonut-lab
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - happydonut-lab
    labelSelectors:
      app: bd-inventario
  delay:
    latency: "200ms"
    correlation: "100"
    jitter: "0ms"
  duration: "5m"
