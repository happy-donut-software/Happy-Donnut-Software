openapi: 3.1.0
info:
  title: Happy Donut API
  version: 2.0.0
  description: Contrato OHS de los cinco contextos delimitados.
servers:
  - url: http://localhost:{port}/api
    variables:
      port: {default: "9000"}
tags:
  - {name: Ventas}
  - {name: Inventario}
  - {name: Finanzas}
  - {name: Usuarios}
  - {name: Tienda Virtual}
  - {name: Observabilidad}
paths:
  /ventas/ordenes:
    post:
      tags: [Ventas]
      operationId: crearOrden
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearOrden"}
      responses:
        "201": {description: Orden creada, content: {application/json: {schema: {$ref: "#/components/schemas/OrdenCreada"}}}}
        "422": {$ref: "#/components/responses/ValidacionInvalida"}
  /ventas/ordenes/{id}/pagar:
    post:
      tags: [Ventas]
      operationId: pagarOrden
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PagarOrden"}}}
      responses:
        "200": {description: Pago registrado, content: {application/json: {schema: {$ref: "#/components/schemas/PagoRegistrado"}}}}
        "400": {$ref: "#/components/responses/ReglaNegocio"}
        "422": {$ref: "#/components/responses/ValidacionInvalida"}
  /inventario/stock/reabastecer:
    post:
      tags: [Inventario]
      operationId: reabastecerStock
      requestBody: {$ref: "#/components/requestBodies/AjustarStock"}
      responses: {"200": {description: Stock actualizado}, "400": {$ref: "#/components/responses/ReglaNegocio"}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /inventario/stock/descontar:
    post:
      tags: [Inventario]
      operationId: descontarStock
      requestBody: {$ref: "#/components/requestBodies/AjustarStock"}
      responses: {"200": {description: Stock descontado}, "400": {$ref: "#/components/responses/ReglaNegocio"}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /finanzas/caja/abrir:
    post:
      tags: [Finanzas]
      operationId: abrirTurno
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [cajero_id, monto_apertura], properties: {cajero_id: {type: string}, monto_apertura: {type: number, minimum: 0}}}}}}
      responses: {"201": {description: Turno abierto}, "400": {$ref: "#/components/responses/ReglaNegocio"}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /finanzas/caja/movimiento:
    post:
      tags: [Finanzas]
      operationId: registrarMovimiento
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [monto, tipo_movimiento], properties: {monto: {type: number, exclusiveMinimum: 0}, tipo_movimiento: {type: string}, descripcion: {type: string}}}}}}
      responses: {"200": {description: Movimiento registrado}, "400": {$ref: "#/components/responses/ReglaNegocio"}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /finanzas/caja/cerrar:
    post:
      tags: [Finanzas]
      operationId: cerrarTurno
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [dinero_fisico_real], properties: {dinero_fisico_real: {type: number, minimum: 0}}}}}}
      responses: {"200": {description: Arqueo finalizado}, "400": {$ref: "#/components/responses/ReglaNegocio"}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /usuarios/registrar:
    post:
      tags: [Usuarios]
      operationId: registrarUsuario
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RegistroUsuario"}}}}
      responses: {"201": {description: Usuario registrado}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /usuarios/login:
    post:
      tags: [Usuarios]
      operationId: iniciarSesion
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password}}}}}}
      responses: {"200": {description: Token emitido}, "401": {description: Credenciales inválidas}}
  /usuarios/me:
    get:
      tags: [Usuarios]
      operationId: obtenerPerfil
      security: [{sanctum: []}]
      responses: {"200": {description: Perfil autenticado}, "401": {description: No autenticado}}
  /usuarios/logout:
    post:
      tags: [Usuarios]
      operationId: cerrarSesion
      security: [{sanctum: []}]
      responses: {"200": {description: Token revocado}, "401": {description: No autenticado}}
  /tienda/carrito/{cliente_id}:
    get:
      tags: [Tienda Virtual]
      operationId: verCarrito
      parameters: [{name: cliente_id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Carrito actual}}
  /tienda/carrito/agregar:
    post:
      tags: [Tienda Virtual]
      operationId: agregarAlCarrito
      requestBody: {$ref: "#/components/requestBodies/ItemCarrito"}
      responses: {"200": {description: Producto agregado}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /tienda/carrito/remover:
    post:
      tags: [Tienda Virtual]
      operationId: removerDelCarrito
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [cliente_id, producto_id], properties: {cliente_id: {type: string}, producto_id: {type: string}}}}}}
      responses: {"200": {description: Producto removido}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /ventas/productos:
    get:
      tags: [Ventas]
      operationId: listarProductosVenta
      parameters: [{name: incluir_inactivos, in: query, required: false, schema: {type: boolean}}]
      responses: {"200": {description: Catalogo de productos vendibles}}
    post:
      tags: [Ventas]
      operationId: crearProductoVenta
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [nombre, categoria_id, precio]}}}}
      responses: {"201": {description: Producto creado}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /ventas/productos/{id}:
    put:
      tags: [Ventas]
      operationId: actualizarProductoVenta
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Producto actualizado}, "404": {description: Producto inexistente}}
    delete:
      tags: [Ventas]
      operationId: desactivarProductoVenta
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Producto desactivado}, "404": {description: Producto inexistente}}
  /ventas/categorias:
    get:
      tags: [Ventas]
      operationId: listarCategoriasProducto
      responses: {"200": {description: Categorias activas del catalogo}}
    post:
      tags: [Ventas]
      operationId: crearCategoriaProducto
      responses: {"201": {description: Categoria creada}, "422": {$ref: "#/components/responses/ValidacionInvalida"}}
  /ventas/categorias/{id}:
    put:
      tags: [Ventas]
      operationId: actualizarCategoriaProducto
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Categoria actualizada}}
    delete:
      tags: [Ventas]
      operationId: eliminarCategoriaProducto
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Categoria eliminada}, "409": {description: Categoria con productos activos}}
  /inventario/productos:
    get:
      tags: [Inventario]
      operationId: listarProductosInventario
      responses: {"200": {description: Inventario completo}}
    post:
      tags: [Inventario]
      operationId: crearProductoInventario
      responses: {"201": {description: Producto agregado al inventario}}
  /inventario/productos/{id}:
    put:
      tags: [Inventario]
      operationId: actualizarProductoInventario
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Inventario actualizado}}
    delete:
      tags: [Inventario]
      operationId: eliminarProductoInventario
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Producto retirado del inventario}}
  /inventario/stock/{id}:
    get:
      tags: [Inventario]
      operationId: consultarStock
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Estado del stock}
        "404": {description: Producto inexistente}
  /inventario/eventos/venta-finalizada:
    post:
      tags: [Inventario]
      operationId: consumirVentaFinalizadaInventario
      parameters: [{$ref: "#/components/parameters/EventosSecret"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/VentaFinalizadaInventario"}}}
      responses:
        "200": {description: Evento duplicado ya procesado}
        "202": {description: Evento aceptado y stock descontado}
        "401": {description: Evento no autorizado}
        "409": {$ref: "#/components/responses/ReglaNegocio"}
        "422": {$ref: "#/components/responses/ValidacionInvalida"}
  /finanzas/eventos/venta-finalizada:
    post:
      tags: [Finanzas]
      operationId: consumirVentaFinalizadaFinanzas
      parameters: [{$ref: "#/components/parameters/EventosSecret"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/VentaFinalizadaFinanzas"}}}
      responses:
        "200": {description: Evento duplicado ya procesado}
        "202": {description: Evento aceptado, ingreso y RUS actualizados}
        "401": {description: Evento no autorizado}
        "409": {$ref: "#/components/responses/ReglaNegocio"}
        "422": {$ref: "#/components/responses/ValidacionInvalida"}
  /finanzas/rus/{periodo}:
    get:
      tags: [Finanzas]
      operationId: consultarAcumuladoRus
      parameters:
        - {name: periodo, in: path, required: true, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200": {description: Acumulado mensual para el RUS}
  /usuarios/clientes-frecuentes:
    get:
      tags: [Usuarios]
      operationId: buscarClientesFrecuentes
      parameters:
        - {name: buscar, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Clientes coincidentes}
  /metrics:
    get:
      tags: [Observabilidad]
      operationId: obtenerMetricasPrometheus
      description: Disponible en cada microservicio mediante acceso directo.
      responses:
        "200":
          description: Metricas en formato Prometheus
          content: {text/plain: {schema: {type: string}}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer}
  parameters:
    EventosSecret: {name: X-Eventos-Secret, in: header, required: true, schema: {type: string, format: password}}
    Id: {name: id, in: path, required: true, schema: {type: string}}
  requestBodies:
    AjustarStock: {required: true, content: {application/json: {schema: {type: object, required: [producto_id, cantidad], properties: {producto_id: {type: string}, cantidad: {type: integer, minimum: 1}}}}}}
    ItemCarrito: {required: true, content: {application/json: {schema: {type: object, required: [cliente_id, producto_id, nombre_producto, cantidad, precio_unitario], properties: {cliente_id: {type: string}, producto_id: {type: string}, nombre_producto: {type: string}, cantidad: {type: integer, minimum: 1}, precio_unitario: {type: number, minimum: 0}}}}}}
  responses:
    ReglaNegocio: {description: Regla de dominio incumplida, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    ValidacionInvalida: {description: Entrada inválida, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    ProductoVenta: {type: object, required: [id, nombre, precio], properties: {id: {type: string}, nombre: {type: string}, precio: {type: number, minimum: 0}}}
    VentaFinalizadaInventario:
      type: object
      required: [evento_id, venta_id, lineas]
      properties:
        evento_id: {type: string}
        venta_id: {type: string}
        ocurrido_en: {type: string, format: date-time}
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required: [producto_id, cantidad]
            properties:
              producto_id: {type: string}
              cantidad: {type: integer, minimum: 1}
    VentaFinalizadaFinanzas:
      type: object
      required: [evento_id, venta_id, total, tipo_comprobante, metodo_pago, ocurrido_en]
      properties:
        evento_id: {type: string}
        venta_id: {type: string}
        total: {type: number, exclusiveMinimum: 0}
        tipo_comprobante: {enum: [BOLETA, NOTA_PEDIDO]}
        metodo_pago: {enum: [EFECTIVO, YAPE, PLIN]}
        ocurrido_en: {type: string, format: date-time}
    Error: {type: object, properties: {error: {type: string}, message: {type: string}, errors: {type: object}}}
    ItemOrden: {type: object, required: [producto_id, cantidad], properties: {producto_id: {type: string}, nombre_producto: {type: string, maxLength: 150}, cantidad: {type: integer, minimum: 1}, precio_unitario: {type: number, minimum: 0}}}
    CrearOrden: {type: object, required: [items], properties: {cliente_id: {type: [string, "null"]}, items: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ItemOrden"}}}}
    OrdenCreada: {type: object, required: [orden_id, total, estado], properties: {orden_id: {type: string}, total: {type: number}, estado: {const: pendiente}}}
    PagarOrden: {type: object, required: [monto_recibido], properties: {monto_recibido: {type: number, minimum: 0}, metodo_pago: {enum: [EFECTIVO, YAPE, PLIN], default: EFECTIVO}, tipo_comprobante: {enum: [BOLETA, NOTA_PEDIDO], default: NOTA_PEDIDO}}}
    PagoRegistrado: {type: object, properties: {orden_id: {type: string}, estado: {const: pagada}, total: {type: number}, monto_recibido: {type: number}, vuelto: {type: number}, metodo_pago: {enum: [EFECTIVO, YAPE, PLIN]}, tipo_comprobante: {enum: [BOLETA, NOTA_PEDIDO]}}}
    RegistroUsuario: {type: object, required: [nombre, email, password, rol], properties: {nombre: {type: string}, email: {type: string, format: email}, password: {type: string, format: password, minLength: 8}, rol: {enum: [admin, cajero, cliente]}}}