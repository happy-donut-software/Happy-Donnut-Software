default:
  suites:
    default:
      paths:    [ "%paths.base%/features" ]
      contexts: [ FeatureContext ]
  formatters:
    progress: ~
    html:
      output_path: coverage/behat

  extensions:
    Behat\MinkExtension:
      base_url: 'http://localhost'
      default_session: symfony_session
      sessions:
        symfony_session:          # Nombre de la sesión (puedes poner el que quieras)
          browserkit_http: ~     # El driver real que Symfony entiende (Cambiado aquí)