apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: happy-donut-local
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/happy-donut-software/Happy-Donnut-Software.git
    targetRevision: develop
    path: gitops/k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: happy-donut
  syncPolicy:
    automated: {prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [CreateNamespace=true, PruneLast=true]
    retry: {limit: 5, backoff: {duration: 5s, factor: 2, maxDuration: 3m}}