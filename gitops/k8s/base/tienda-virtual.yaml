apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-tienda-virtual
  labels: {app.kubernetes.io/name: servicio-tienda-virtual, app.kubernetes.io/part-of: happy-donut}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: servicio-tienda-virtual}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: servicio-tienda-virtual, app.kubernetes.io/part-of: happy-donut}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 82, runAsGroup: 82, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/happy-donut-software/happy-donnut-software/tienda-virtual:develop
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: happy-donut-config}
            - secretRef: {name: happy-donut-secrets}
          env:
            - {name: DB_HOST, value: bd-tienda-virtual}
            - {name: DB_DATABASE, value: tienda_virtual_db}
            - {name: SERVICE_NAME, value: "tienda-virtual"}
            - {name: OTEL_SERVICE_NAME, value: "tienda-virtual"}
          readinessProbe: {httpGet: {path: /up, port: http}, initialDelaySeconds: 20, timeoutSeconds: 5, periodSeconds: 10, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /up, port: http}, initialDelaySeconds: 60, timeoutSeconds: 5, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-tienda-virtual
  labels: {app.kubernetes.io/name: servicio-tienda-virtual, app.kubernetes.io/part-of: happy-donut}
spec:
  selector: {app.kubernetes.io/name: servicio-tienda-virtual}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: servicio-tienda-virtual}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: servicio-tienda-virtual}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: servicio-tienda-virtual}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: servicio-tienda-virtual}
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}