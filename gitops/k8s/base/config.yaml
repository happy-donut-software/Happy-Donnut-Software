apiVersion: v1
kind: ConfigMap
metadata: {name: happy-donut-config}
data:
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  QUEUE_CONNECTION: rabbitmq
  CACHE_STORE: redis
  SESSION_DRIVER: cookie
---
apiVersion: v1
kind: Secret
metadata: {name: happy-donut-secrets}
type: Opaque
stringData:
  APP_KEY: REPLACE_WITH_EXTERNAL_SECRET
  DB_HOST: REPLACE_WITH_SERVICE_SPECIFIC_CONFIGURATION
  DB_DATABASE: REPLACE_WITH_SERVICE_SPECIFIC_CONFIGURATION
  DB_USERNAME: REPLACE_WITH_EXTERNAL_SECRET
  DB_PASSWORD: REPLACE_WITH_EXTERNAL_SECRET
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: REPLACE_WITH_EXTERNAL_SECRET
  RABBITMQ_PASSWORD: REPLACE_WITH_EXTERNAL_SECRET