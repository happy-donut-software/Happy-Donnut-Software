apiVersion: v1
kind: Service
metadata: {name: bd-ventas}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: bd-ventas}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: bd-ventas}
spec:
  serviceName: bd-ventas
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: bd-ventas}}
  template:
    metadata: {labels: {app.kubernetes.io/name: bd-ventas, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: ventas_db}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: happy-donut-secrets, key: DB_USERNAME}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: happy-donut-secrets, key: DB_PASSWORD}}
          readinessProbe: {exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d ventas_db"]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 384Mi}
          volumeMounts: [{name: datos, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: datos}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
