apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rabbitmq}}
  template:
    metadata: {labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: happy-donut-secrets, key: RABBITMQ_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: happy-donut-secrets, key: RABBITMQ_PASSWORD}}
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 30, timeoutSeconds: 10, periodSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: rabbitmq}
  ports: [{name: amqp, port: 5672}, {name: management, port: 15672, nodePort: 31672}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, "yes"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend-clientes}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: frontend-clientes}}
  template:
    metadata: {labels: {app.kubernetes.io/name: frontend-clientes, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: web
          image: happy-donut/frontend-clientes:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 192Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend-clientes}
spec:
  selector: {app.kubernetes.io/name: frontend-clientes}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend-administrativo}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: frontend-administrativo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: frontend-administrativo, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: web
          image: happy-donut/frontend-administrativo:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /admin/, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 192Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend-administrativo}
spec:
  selector: {app.kubernetes.io/name: frontend-administrativo}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: happy-donut-gateway}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location /api/ventas/ { proxy_pass http://servicio-ventas; proxy_set_header Host $host; }
      location /api/inventario/ { proxy_pass http://servicio-inventario; proxy_set_header Host $host; }
      location /api/usuarios/ { proxy_pass http://servicio-usuarios; proxy_set_header Host $host; }
      location /api/finanzas/ { proxy_pass http://servicio-finanzas; proxy_set_header Host $host; }
      location /api/tienda/ { proxy_pass http://servicio-tienda-virtual; proxy_set_header Host $host; }
      location /admin/ { proxy_pass http://frontend-administrativo; proxy_set_header Host $host; }
      location / { proxy_pass http://frontend-clientes; proxy_set_header Host $host; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: happy-donut-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: happy-donut-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: happy-donut-gateway, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{name: http, containerPort: 8080}]
          command: ["nginx", "-g", "daemon off;"]
          volumeMounts: [{name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes: [{name: config, configMap: {name: happy-donut-gateway}}]
---
apiVersion: v1
kind: Service
metadata: {name: happy-donut-gateway}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: happy-donut-gateway}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ventas-outbox-worker}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: ventas-outbox-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: ventas-outbox-worker, app.kubernetes.io/part-of: happy-donut}}
    spec:
      containers:
        - name: worker
          image: happy-donut/ventas:local
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "ventas:publicar-eventos", "--continuo"]
          envFrom: [{configMapRef: {name: happy-donut-config}}, {secretRef: {name: happy-donut-secrets}}]
          env:
            - {name: DB_HOST, value: bd-ventas}
            - {name: DB_DATABASE, value: ventas_db}
            - {name: SERVICE_NAME, value: ventas-outbox-worker}
            - {name: OTEL_SERVICE_NAME, value: ventas-outbox-worker}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 384Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}