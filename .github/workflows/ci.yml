name: CI
on:
  pull_request:
  push:
    branches: [develop, develop3, main]
permissions:
  contents: read
jobs:
  phpunit:
    strategy:
      fail-fast: false
      matrix:
        service: [ventas, inventario, finanzas, usuarios, tienda-virtual]
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: "${{ matrix.service }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: "8.4", coverage: pcov, extensions: pdo_sqlite}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --coverage-clover=coverage.xml --min=80
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "coverage-${{ matrix.service }}", path: "${{ matrix.service }}/coverage.xml"}
  frontend:
    strategy:
      matrix:
        app: [frontend-administrativo, frontend-clientes]
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: "${{ matrix.app }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: "${{ matrix.app }}/package-lock.json"}
      - run: npm ci
      - run: npm run build
  contracts-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npx --yes @redocly/cli lint openapi/openapi.yaml
      - run: cp .env.example .env && docker compose config --quiet
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize gitops/k8s/overlays/production >/dev/null