name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feat/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-frontend:
    name: Frontend · ${{ matrix.aplicacion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - aplicacion: clientes
            directorio: frontend-clientes
            comando: npm test -- --watchAll=false
          - aplicacion: administrativo
            directorio: frontend-administrativo/src
            comando: npm run lint && npm run type-check
    defaults:
      run:
        working-directory: ${{ matrix.directorio }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directorio }}/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Validar código
        run: ${{ matrix.comando }}
      - name: Construir aplicación
        run: npm run build
