name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feat/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas-laravel:
    name: Laravel · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [ventas, inventario, usuarios, finanzas, tienda-virtual]
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ matrix.servicio }}-${{ hashFiles(format('{0}/composer.lock', matrix.servicio)) }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.servicio }}-
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Ejecutar pruebas
        run: composer test
