name: CI Happy Donnut Pipeline Global

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  infrastructure-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear archivo .env de prueba
        run: |
          touch .env
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=secret" >> .env
          echo "RABBITMQ_USER=admin" >> .env
          echo "RABBITMQ_PASS=secret" >> .env
          
          echo "VENTAS_APP_KEY=base64:JpwkG8hRj+xPZlO+y3Y1q9sF4aE6bH7cD8eF9gH0aI8=" >> .env
          echo "INVENTARIO_APP_KEY=base64:JpwkG8hRj+xPZlO+y3Y1q9sF4aE6bH7cD8eF9gH0aI8=" >> .env
          echo "USUARIOS_APP_KEY=base64:JpwkG8hRj+xPZlO+y3Y1q9sF4aE6bH7cD8eF9gH0aI8=" >> .env
          echo "FINANZAS_APP_KEY=base64:JpwkG8hRj+xPZlO+y3Y1q9sF4aE6bH7cD8eF9gH0aI8=" >> .env
          echo "TIENDA_APP_KEY=base64:JpwkG8hRj+xPZlO+y3Y1q9sF4aE6bH7cD8eF9gH0aI8=" >> .env

      - name: Levantar Microservicios con Docker Compose
        run: docker compose up -d --build

      - name: Esperar que los servicios estén listos (Healthcheck)
        run: |
          echo "Esperando estabilidad de los contenedores..."
          sleep 20
          docker ps

      - name: Instalar Dependencias y PCOV en Servicio de Usuarios
        run: |
          docker compose exec -T servicio-usuarios composer install --no-interaction --prefer-dist
          docker compose exec -T servicio-usuarios sh -c "apk add --no-cache autoconf build-base || (apt-get update && apt-get install -y autoconf build-essential)"
          
          docker compose exec -T servicio-usuarios pecl install pcov
          docker compose exec -T servicio-usuarios docker-php-ext-enable pcov
      - name: Ejecutar Pruebas Base (PHPUnit)
        run: |
          echo "=== PROBANDO SERVICIO USUARIOS ==="
          docker compose exec -T servicio-usuarios php -d pcov.enabled=1 ./vendor/bin/phpunit --coverage-text

      - name: Quality Gate Estricto (Infection > 80%)
        run: |
          echo "=== VALIDANDO UMBRAL DE CALIDAD (Fase 3) ==="
          docker compose exec -T servicio-usuarios php -d pcov.enabled=1 ./vendor/bin/infection --min-msi=80 --min-covered-msi=80

      - name: Status Accounting (Generar log SCM - Fase 5)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          echo "=== REGISTRANDO ESTADO DE APROBACIÓN ==="
          echo '{ 
            "commit": "${{ github.sha }}", 
            "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")", 
            "author": "${{ github.actor }}", 
            "status": "MERGED_SUCCESSFULLY_WITH_80_COVERAGE" 
          }' > scm-status-report.json
          cat scm-status-report.json

      - name: Apagar Infraestructura
        if: always()
        run: docker compose down -v

  # ==============================================================================
  # NUEVA FASE 2: DESPLIEGUE CONTINUO Y GITOPS
  # ==============================================================================
  deploy-to-gitops:
    name: Fase 2 - CD y GitOps
    needs: infrastructure-and-test 
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Generar Versionamiento Semántico (SemVer 2.0.0)
        id: version
        run: |
          VERSION="v1.2.${{ github.run_number }}"
          echo "TAG=$VERSION" >> $GITHUB_ENV
          echo "Versión inmutable generada: $VERSION"

      - name: Descargar Repositorio de Configuración (GitOps)
        uses: actions/checkout@v4
        with:
          repository: 'happy-donut-software/configuracion'
          token: ${{ secrets.GITOPS_TOKEN }}
          path: 'gitops-repo'

      - name: Actualizar deployment.yaml automáticamente
        run: |
          cd gitops-repo
          
          sed -i "s|image: .*|image: usuario/mvp:${{ env.TAG }}|g" k8s/desarrollo/deployment.yaml
          
          echo "=== Subiendo cambios al repositorio GitOps ==="
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/desarrollo/deployment.yaml
          git commit -m "chore(cd): actualización automática a versión inmutable ${{ env.TAG }}"
          git push origin main