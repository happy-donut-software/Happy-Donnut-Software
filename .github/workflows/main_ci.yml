name: CI Happy Donnut Pipeline Global

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  infrastructure-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear archivo .env de prueba
        run: |
          touch .env
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=secret" >> .env
          echo "DB_NAME_API_GATEWAY=apigateway_db" >> .env
          echo "DB_NAME_AUTH=auth_db" >> .env
          echo "DB_NAME_PRODUCT=product_db" >> .env
          echo "DB_NAME_INVENTORY=inventory_db" >> .env
          echo "DB_NAME_ORDER=order_db" >> .env
          echo "DB_NAME_EMAIL=email_db" >> .env
          echo "RABBITMQ_USER=admin" >> .env
          echo "RABBITMQ_PASS=secret" >> .env

      - name: Validar sintaxis de Nginx
        run: |
          docker run --rm -t -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t

      - name: Levantar Microservicios con Docker Compose
        run: docker-compose up -d --build

      - name: Esperar que los servicios estén listos (Healthcheck)
        run: |
          echo "Esperando estabilidad de los contenedores..."
          sleep 15
          docker ps

      - name: Ejecutar Pruebas Globales (PHPUnit)
        run: |
          echo "=== PROBANDO AUTH SERVICE ==="
          docker compose exec -T auth-service composer install --no-interaction --prefer-dist
          docker compose exec -T auth-service ./vendor/bin/phpunit

          echo "=== PROBANDO PRODUCT SERVICE ==="
          docker compose exec -T product-service composer install --no-interaction --prefer-dist
          docker compose exec -T product-service ./vendor/bin/phpunit

          echo "=== PROBANDO INVENTORY SERVICE ==="
          docker compose exec -T inventory-service composer install --no-interaction --prefer-dist
          docker compose exec -T inventory-service ./vendor/bin/phpunit

          echo "=== PROBANDO ORDER SERVICE ==="
          docker compose exec -T order-service composer install --no-interaction --prefer-dist
          docker compose exec -T order-service ./vendor/bin/phpunit

          echo "=== PROBANDO EMAIL SERVICE ==="
          docker compose exec -T email-service composer install --no-interaction --prefer-dist
          docker compose exec -T email-service ./vendor/bin/phpunit

      - name: Apagar Infraestructura
        if: always()
        run: docker-compose down -v