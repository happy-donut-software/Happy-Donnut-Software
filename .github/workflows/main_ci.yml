name: CI Happy Donnut Pipeline Global

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  infrastructure-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear archivo .env de prueba
        run: |
          touch .env
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=secret" >> .env
          echo "DB_NAME_API_GATEWAY=apigateway_db" >> .env
          echo "DB_NAME_AUTH=auth_db" >> .env
          echo "DB_NAME_PRODUCT=product_db" >> .env
          echo "DB_NAME_INVENTORY=inventory_db" >> .env
          echo "DB_NAME_ORDER=order_db" >> .env
          echo "DB_NAME_EMAIL=email_db" >> .env
          echo "RABBITMQ_USER=admin" >> .env
          echo "RABBITMQ_PASS=secret" >> .env

      - name: Levantar Microservicios con Docker Compose
        run: docker compose up -d --build

      - name: Esperar que los servicios estén listos (Healthcheck)
        run: |
          echo "Esperando estabilidad de los contenedores..."
          sleep 15
          docker ps

      - name: Instalar Dependencias y PCOV en Auth Service
        run: |
          docker compose exec -T auth-service composer install --no-interaction --prefer-dist
          # Habilitamos PCOV para medir la cobertura real
          docker compose exec -T auth-service pecl install pcov
          docker compose exec -T auth-service docker-php-ext-enable pcov

      - name: Ejecutar Pruebas Base (PHPUnit)
        run: |
          echo "=== PROBANDO AUTH SERVICE ==="
          docker compose exec -T auth-service php -d pcov.enabled=1 ./vendor/bin/phpunit --coverage-text

      - name: Quality Gate Estricto (Infection > 80%)
        run: |
          echo "=== VALIDANDO UMBRAL DE CALIDAD (Fase 3) ==="
          # El pipeline fallará automáticamente si el MSI (Mutation Score) es menor a 80%
          docker compose exec -T auth-service php -d pcov.enabled=1 ./vendor/bin/infection --min-msi=80 --min-covered-msi=80

      - name: Status Accounting (Generar log SCM - Fase 5)
        # Solo se ejecuta si los tests pasaron y si es un merge directo a main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          echo "=== REGISTRANDO ESTADO DE APROBACIÓN ==="
          echo '{ 
            "commit": "${{ github.sha }}", 
            "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")", 
            "author": "${{ github.actor }}", 
            "status": "MERGED_SUCCESSFULLY_WITH_80_COVERAGE" 
          }' > scm-status-report.json
          cat scm-status-report.json

      - name: Apagar Infraestructura
        if: always()
        run: docker compose down -v