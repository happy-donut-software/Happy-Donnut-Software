name: Mutation analysis
on:
  workflow_dispatch:
  schedule: [{cron: "0 5 * * 1"}]
permissions: {contents: read}
jobs:
  infection-ventas:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ventas}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: "8.4", coverage: xdebug}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer global require infection/infection --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: $(composer global config bin-dir --absolute)/infection --threads=max --min-msi=70 --min-covered-msi=80 --logger-github