# ==============================================================================
# MVP v1.1 - Happy Donut (Arquitectura de Microservicios con DDD)
# ==============================================================================

services:

  # -----------------------------------------------------------------
  # 1. BROKER DE MENSAJERÍA ASÍNCRONA (RabbitMQ)
  # -----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: happydonut-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # Puerto para comunicación entre apps
      - "15672:15672" # Panel de administración web (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    networks:
      - red-happydonut

  # -----------------------------------------------------------------
  # 2. SERVIDORES DE BASE DE DATOS DEDICADOS
  # -----------------------------------------------------------------
  bd-ventas:
    image: postgres:16-alpine
    container_name: happydonut-bd-ventas
    restart: unless-stopped
    volumes:
      - vol-bd-ventas:/var/lib/postgresql/data
    env_file: [ "./.env" ]
    environment:
      - POSTGRES_DB=ventas_db
    networks:
      - red-happydonut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ventas_db"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5440:5432"

  bd-inventario:
    image: postgres:16-alpine
    container_name: happydonut-bd-inventario
    restart: unless-stopped
    volumes:
      - vol-bd-inventario:/var/lib/postgresql/data
    env_file: [ "./.env" ]
    environment:
      - POSTGRES_DB=inventario_db
    networks:
      - red-happydonut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d inventario_db"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5441:5432"

  bd-usuarios:
    image: postgres:16-alpine
    container_name: happydonut-bd-usuarios
    restart: unless-stopped
    volumes:
      - vol-bd-usuarios:/var/lib/postgresql/data
    env_file: [ "./.env" ]
    environment:
      - POSTGRES_DB=usuarios_db
    networks:
      - red-happydonut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d usuarios_db"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5442:5432"

  bd-finanzas:
    image: postgres:16-alpine
    container_name: happydonut-bd-finanzas
    restart: unless-stopped
    volumes:
      - vol-bd-finanzas:/var/lib/postgresql/data
    env_file: [ "./.env" ]
    environment:
      - POSTGRES_DB=finanzas_db
    networks:
      - red-happydonut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d finanzas_db"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5443:5432"

  bd-tienda-virtual:
    image: postgres:16-alpine
    container_name: happydonut-bd-tienda-virtual
    restart: unless-stopped
    volumes:
      - vol-bd-tienda-virtual:/var/lib/postgresql/data
    env_file: [ "./.env" ]
    environment:
      - POSTGRES_DB=tienda_virtual_db
    networks:
      - red-happydonut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tienda_virtual_db"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5444:5432"

  # -----------------------------------------------------------------
  # 3. CAPA DE MICROSERVICIOS (Laravel PHP)
  # -----------------------------------------------------------------
  servicio-ventas:
    build:
      context: ./ventas
      target: local
    container_name: happydonut-app-ventas
    restart: unless-stopped
    ports:
      - "9000:8000"
    volumes:
      - ./ventas:/var/www
      - /var/www/vendor
    env_file: [ "./.env" ]
    environment:
      - APP_KEY=${VENTAS_APP_KEY}
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=bd-ventas
      - DB_PORT=5432
      - DB_DATABASE=ventas_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_CONNECTION=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - FINANZAS_CAJA_ESTADO_URL=http://servicio-finanzas/api/finanzas/caja/actual
    depends_on:
      bd-ventas:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - red-happydonut
    command: >
      sh -c "composer install --no-interaction && 
             php artisan migrate --force && 
             php artisan serve --host=0.0.0.0 --port=8000"

  servicio-inventario:
    build:
      context: ./inventario
      target: local
    container_name: happydonut-app-inventario
    restart: unless-stopped
    ports:
      - "9001:8000"
    volumes:
      - ./inventario:/var/www
      - /var/www/vendor
    env_file: [ "./.env" ]
    environment:
      - APP_KEY=${INVENTARIO_APP_KEY}
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=bd-inventario
      - DB_PORT=5432
      - DB_DATABASE=inventario_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_CONNECTION=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - CACHE_STORE=file
      - SESSION_DRIVER=file
    depends_on:
      bd-inventario:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - red-happydonut

  servicio-usuarios:
    build:
      context: ./usuarios
      target: local
    container_name: happydonut-app-usuarios
    restart: unless-stopped
    ports:
      - "9002:8000"
    volumes:
      - ./usuarios:/var/www
      - /var/www/vendor
    env_file: [ "./.env" ]
    environment:
      - APP_KEY=${USUARIOS_APP_KEY}
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=bd-usuarios
      - DB_PORT=5432
      - DB_DATABASE=usuarios_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
    depends_on:
      bd-usuarios:
        condition: service_healthy
    networks:
      - red-happydonut

  servicio-finanzas:
    build:
      context: ./finanzas
      target: local
    container_name: happydonut-app-finanzas
    restart: unless-stopped
    ports:
      - "9003:8000"
    volumes:
      - ./finanzas:/var/www
      - /var/www/vendor
    env_file: [ "./.env" ]
    environment:
      - APP_KEY=${FINANZAS_APP_KEY}
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=bd-finanzas
      - DB_PORT=5432
      - DB_DATABASE=finanzas_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
    depends_on:
      bd-finanzas:
        condition: service_healthy
    networks:
      - red-happydonut

  servicio-tienda-virtual:
    build:
      context: ./tienda-virtual
      target: local
    container_name: happydonut-app-tienda-virtual
    restart: unless-stopped
    ports:
      - "9004:8000"
    volumes:
      - ./tienda-virtual:/var/www
      - /var/www/vendor
    env_file: [ "./.env" ]
    environment:
      - APP_KEY=${TIENDA_APP_KEY}
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=bd-tienda-virtual
      - DB_PORT=5432
      - DB_DATABASE=tienda_virtual_db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
    depends_on:
      bd-tienda-virtual:
        condition: service_healthy
    networks:
      - red-happydonut

  # -----------------------------------------------------------------
  # 4. CAPA DE FRONTENDS (React / Vite)
  # -----------------------------------------------------------------
  frontend-clientes:
    build:
      context: ./frontend-clientes
      target: development
    container_name: happydonut-frontend-clientes
    restart: unless-stopped
    volumes:
      - ./frontend-clientes:/app
      - /app/node_modules
    ports:
      - "3000:3000" 
    environment:
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    networks:
      - red-happydonut

  frontend-administrativo:
    build:
      context: ./frontend-administrativo
      target: development
    container_name: happydonut-frontend-administrativo
    restart: unless-stopped
    volumes:
      - ./frontend-administrativo:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_PORT=5173
    networks:
      - red-happydonut

# -----------------------------------------------------------------
# REDES Y VOLÚMENES GLOBALES
# -----------------------------------------------------------------
volumes:
  vol-bd-ventas: 
  vol-bd-inventario:
  vol-bd-usuarios:
  vol-bd-finanzas:
  vol-bd-tienda-virtual:
  vol-rabbitmq:

networks:
  red-happydonut:
    driver: bridge